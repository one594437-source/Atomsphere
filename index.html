
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020735">
<title>ATOMSPHERE</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --background: #020735;
  --panel: #071044;
  --blue: #526aff;
  --blue-dark: #152879;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #101d55 0%, #020735 65%);
  color: white;
  font-family: Arial, sans-serif;
}

/* HEADER */

header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 5%;
  background: rgba(7,16,68,0.9);
  border-bottom: 1px solid rgba(82,106,255,0.5);
}

.brand {
  color: white;
  text-decoration: none;
  font-size: 27px;
  font-weight: bold;
  letter-spacing: 4px;
}

/* HOME BUTTON */

.menu {
  position: relative;
}

.menu-button {
  padding: 12px 25px;
  border: 1px solid var(--blue);
  border-radius: 8px;
  background: var(--blue-dark);
  color: white;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .25s;
}

.menu-button:hover,
.menu-button[aria-expanded="true"] {
  background: #263caa;
  box-shadow: 0 0 18px #526aff55;
}

/* DROPDOWN */

.dropdown {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  min-width: 200px;
  padding: 8px;
  background: var(--panel);
  border: 1px solid var(--blue);
  border-radius: 10px;
  box-shadow: 0 8px 28px #0009;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: .2s;
}

.dropdown.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dropdown a {
  display: block;
  padding: 14px;
  color: white;
  text-decoration: none;
  border-radius: 7px;
  letter-spacing: 1px;
}

.dropdown a:hover {
  background: var(--blue-dark);
}

/* MAIN */

main {
  min-height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.hero {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* SMALLER LOGO */

.hero-image {
  display: block;
  width: 400px;
  max-width: 75%;
  max-height: 55vh;
  object-fit: contain;
  border-radius: 12px;
  filter: drop-shadow(0 0 20px #263caa55);
}

/* MOBILE */

@media (max-width: 600px) {
  header {
    padding: 18px 5%;
  }

  .brand {
    font-size: 20px;
    letter-spacing: 2px;
  }

  .menu-button {
    padding: 11px 18px;
    font-size: 13px;
  }

  .hero-image {
    width: 300px;
    max-width: 85%;
  }
}
</style>
</head>

<body>

<header>
  <a class="brand" href="index.html">ATOMSPHERE</a>

  <nav class="menu" aria-label="Hauptmenü">

    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-expanded="false"
      aria-controls="dropdownMenu"
    >
      HOME
    </button>

    <div class="dropdown" id="dropdownMenu">
      <a href="veggies.html">VEGGIES</a>
    </div>

  </nav>
</header>

<main>
  <section class="hero">
    <img
      class="hero-image"
      src="Atomsphere.png"
      alt="Atomsphere"
    >
  </section>
</main>

<script>
const menuButton = document.getElementById("menuButton");
const dropdownMenu = document.getElementById("dropdownMenu");

function setMenuOpen(open) {
  dropdownMenu.classList.toggle("open", open);
  menuButton.setAttribute("aria-expanded", String(open));
}

menuButton.addEventListener("click", (event) => {
  event.stopPropagation();

  setMenuOpen(
    menuButton.getAttribute("aria-expanded") !== "true"
  );
});

document.addEventListener("click", (event) => {
  if (!event.target.closest(".menu")) {
    setMenuOpen(false);
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    setMenuOpen(false);
    menuButton.focus();
  }
});
</script>

</body>
</html>
