<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      text-align: center;
    }

    .product-image {
      width: min(500px, 90vw);
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }

    h1 {
      font-size: 60px;
      font-weight: 700;
      letter-spacing: -2px;
    }

    p {
      margin-top: 15px;
      color: #888;
      font-size: 18px;
    }

    button {
      margin-top: 30px;
      padding: 14px 30px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }
  </style>
</head>

<body>

  <div class="content">
    <img
      src="dd997eb3-f814-49fa-bc03-673945f9a398.jpg"
      alt="Billionaire's Coffee"
      class="product-image"
    >

    <h1>BILLIONAIRE'S COFFEE</h1>
    <p>Premium coffee for those who appreciate the extraordinary.</p>

    <button>Shop Now</button>
  </div>

</body>
</html>
