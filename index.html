<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#061a40,#0b2a63,#123b87);
    color:white;
    height:100vh;
    overflow:hidden;
}

/* Kopf */
header{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:bold;
    letter-spacing:8px;
    color:white;
    text-shadow:0 0 12px rgba(255,255,255,.9);
    border-bottom:1px solid rgba(255,255,255,.15);
}

/* Layout */
.container{
    display:flex;
    height:calc(100vh - 80px);
}

/* Sidebar */
.sidebar{
    width:260px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-right:1px solid rgba(255,255,255,.15);
    padding:18px;
    overflow:auto;
}

.menu-item{
    margin-bottom:10px;
}

.menu-title{
    width:100%;
    background:rgba(255,255,255,.08);
    color:white;
    border:none;
    padding:14px;
    text-align:left;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
    box-shadow:0 0 8px rgba(255,255,255,.12);
}

.menu-title:hover{
    background:rgba(255,255,255,.18);
    box-shadow:0 0 15px rgba(255,255,255,.35);
}

.submenu{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
    margin-left:10px;
}

.menu-item:hover .submenu{
    max-height:220px;
}

.submenu a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:10px 12px;
    margin-top:6px;
    border-radius:8px;
    background:rgba(255,255,255,.05);
    transition:.3s;
    font-size:14px;
}

.submenu a:hover{
    background:rgba(255,255,255,.18);
}

/* Inhalt */
.content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.content h1{
    font-size:50px;
    text-shadow:0 0 15px white;
}

.content p{
    margin-top:15px;
    color:#dfe9ff;
    font-size:18px;
}
</style>
</head>

<body>

<header>ATOM</header>

<div class="container">

    <aside class="sidebar">

        <div class="menu-item">
            <button class="menu-title">📘 Online Kurse</button>
            <div class="submenu">
                <a href="#">Webentwicklung</a>
                <a href="#">Python</a>
                <a href="#">JavaScript</a>
                <a href="#">UI Design</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">📊 Dashboard</button>
            <div class="submenu">
                <a href="#">Übersicht</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">💼 Projekte</button>
            <div class="submenu">
                <a href="#">Meine Projekte</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">📂 Ressourcen</button>
            <div class="submenu">
                <a href="#">Dateien</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">👥 Community</button>
            <div class="submenu">
                <a href="#">Forum</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">⬇ Downloads</button>
            <div class="submenu">
                <a href="#">Material</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">📅 Kalender</button>
            <div class="submenu">
                <a href="#">Termine</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">🏆 Zertifikate</button>
            <div class="submenu">
                <a href="#">Meine Zertifikate</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">⚙ Einstellungen</button>
            <div class="submenu">
                <a href="#">Profil</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">❓ Hilfe</button>
            <div class="submenu">
                <a href="#">Support</a>
            </div>
        </div>

    </aside>

    <main class="content">
        <h1>Willkommen bei ATOM</h1>
        <p>Dunkelblaues Design mit ausklappbarem Seitenmenü.</p>
    </main>

</div>

</body>
</html>
