
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOMSPHERE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #020735;
    color: white;
    font-family: Arial, sans-serif;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 270px;
    height: 100vh;
    background: #071044;
    border-right: 2px solid #526aff;
    padding: 30px 20px;
    z-index: 1000;
    transition: transform 0.3s ease;
}

.sidebar.closed {
    transform: translateX(-100%);
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.sidebar-header h2 {
    font-size: 23px;
    letter-spacing: 1px;
}

.close-btn {
    background: none;
    border: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
}

.close-btn:hover {
    color: #8996ff;
}

.menu-links {
    list-style: none;
}

.menu-links li {
    margin-bottom: 12px;
}

.menu-links a {
    display: block;
    padding: 17px 12px;
    color: #dce3ff;
    text-decoration: none;
    border-radius: 9px;
    border-bottom: 1px solid #263879;
    transition: 0.3s;
    font-size: 14px;
    font-weight: bold;
}

.menu-links a:hover,
.menu-links a.active {
    background: #152879;
    color: white;
    border: 1px solid #526aff;
    box-shadow: 0 0 12px #263caa;
}

.sidebar-footer {
    position: absolute;
    bottom: 25px;
    left: 20px;
    color: #8996d8;
    font-size: 11px;
    line-height: 2;
}

.impressum-link {
    display: block;
    margin-top: 5px;
    color: white;
    font-size: 11px;
    text-decoration: underline;
}

/* MENU BUTTON */

.open-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 900;
    background: #101e68;
    color: white;
    border: 1px solid #657dff;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 24px;
    cursor: pointer;
    display: none;
}

.open-btn.visible {
    display: block;
}

/* MAIN CONTENT */

.main {
    min-height: 100vh;
    margin-left: 270px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 25px;
    background: radial-gradient(
        ellipse at center,
        #101b75 0%,
        #020735 75%
    );
    transition: margin-left 0.3s ease;
}

.main.expanded {
    margin-left: 0;
}

.logo {
    width: min(100%, 650px);
    height: auto;
    display: block;
}

.tagline {
    margin-top: 25px;
    text-align: center;
    font-size: clamp(25px, 4vw, 42px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 18px #526aff;
}

/* MOBILE */

@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar.closed {
        transform: translateX(-100%);
    }

    .open-btn {
        display: block;
    }

    .main {
        margin-left: 0;
        padding: 100px 20px 40px;
    }

    .logo {
        width: 100%;
        max-width: 550px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <h2>ATOMSPHERE</h2>

        <button class="close-btn"
                onclick="closeMenu()">
            ×
        </button>
    </div>

    <ul class="menu-links">

        <li>
            <a href="index.html" class="active">HOME</a>
        </li>

        <li>
            <a href="sample1.html">VEGGIES</a>
        </li>

    </ul>

    <div class="sidebar-footer">
        © 2026 ATOMSPHERE<br>
        THE POWER OF GOD !

        <a href="impressum.html" class="impressum-link">
            IMPRESSUM
        </a>
    </div>

</aside>

<!-- OPEN MENU BUTTON -->

<button class="open-btn"
        id="openBtn"
        onclick="openMenu()">
    ☰
</button>

<!-- HOMEPAGE -->

<main class="main" id="main">

    <img
        src="Atomsphere.png"
        alt="ATOMSPHERE Logo"
        class="logo"
    >

    <h1 class="tagline">
        The power of God !
    </h1>

</main>

<script>

const sidebar = document.getElementById("sidebar");
const openBtn = document.getElementById("openBtn");
const main = document.getElementById("main");

function openMenu() {
    sidebar.classList.remove("closed");
    sidebar.classList.add("open");

    openBtn.classList.remove("visible");
    main.classList.remove("expanded");
}

function closeMenu() {
    sidebar.classList.remove("open");
    sidebar.classList.add("closed");

    openBtn.classList.add("visible");
    main.classList.add("expanded");
}

// Close menu when clicking outside on mobile

document.addEventListener("click", function(event) {

    if (
        window.innerWidth <= 768 &&
        sidebar.classList.contains("open") &&
        !sidebar.contains(event.target) &&
        !openBtn.contains(event.target)
    ) {
        closeMenu();
    }

});

</script>

</body>
</html>
