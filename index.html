.container{

/* ===== SIDEBAR ===== */

.sidebar{
    width:270px;

.logo{

}

.menu-item{

.menu-title{
    width:100%;
    background:rgba(255,255,255,.04);
    color:white;
    border:1px solid rgba(255,255,255,.05);
    padding:13px 14px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:.25s;
    font-size:15px;
}

.menu-title:hover{
    background:rgba(66,133,244,.18);
    border-color:rgba(110,170,255,.25);
    box-shadow:0 0 14px rgba(70,140,255,.18);
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    width:34px;
    height:34px;
    border-radius:50%;
    border:2px solid #4EA1FF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:#fff;
    box-shadow:0 0 10px rgba(78,161,255,.25);
}

.arrow{
    transition:.25s;
}

.submenu{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    margin-left:18px;
}

.menu-item:hover .submenu{
    max-height:220px;
}

.menu-item:hover .arrow{
    transform:rotate(90deg);
}

.submenu a{
    display:block;
    text-decoration:none;
    color:#D8E9FF;
    padding:9px 14px;
    margin-top:6px;
    border-left:2px solid #4EA1FF;
    background:rgba(255,255,255,.03);
    border-radius:6px;
    transition:.2s;
    font-size:14px;
}

.submenu a:hover{
    background:rgba(78,161,255,.12);
    color:#fff;
}

/* ===== CONTENT ===== */

.content{
    flex:1;
    background:
    linear-gradient(160deg,
    rgba(255,255,255,.03) 0%,
    transparent 30%),
    linear-gradient(135deg,#020B18,#041A34,#07254A);
    position:relative;
}

.content:before{
    content:"";
    position:absolute;
    right:-100px;
    top:-40px;
    width:280px;
    height:280px;
    transform:rotate(35deg);
    background:linear-gradient(to right,
    transparent,
    rgba(120,180,255,.06),
    transparent);
}

.content:after{
    content:"";
    position:absolute;
    left:35%;
    bottom:-100px;
    width:240px;
    height:240px;
    transform:rotate(35deg);
    background:linear-gradient(to right,
    transparent,
    rgba(120,180,255,.04),
    transparent);
}
</style>
