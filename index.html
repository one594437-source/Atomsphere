<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#00174F;
    color:white;
    height:100vh;
    overflow:hidden;
}

header{
    height:90px;
    background:#00174F;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-left:180px;

    border-bottom:1px solid rgba(255,255,255,.08);
}

header h1{
    font-size:48px;
    letter-spacing:16px;
    font-weight:700;
    color:#fff;

    text-shadow:
        0 0 10px rgba(255,255,255,.95),
        0 0 22px rgba(100,170,255,.65),
        0 0 40px rgba(0,90,255,.35);
}

.container{
    display:flex;
    height:calc(100vh - 90px);
    background:#00174F;
}

.sidebar{
    width:270px;
    background:#00174F;

    border-right:1px solid rgba(255,255,255,.08);

    padding:18px;

    overflow-y:auto;
}

.logo{
    color:#9CCBFF;
    font-size:13px;
    letter-spacing:3px;
    margin-bottom:18px;
    text-transform:uppercase;
}

.menu-item{
    margin-bottom:10px;
}

.menu-title{
    width:100%;
    background:rgba(255,255,255,.045);
    color:white;
    border:1px solid rgba(255,255,255,.08);

    padding:13px 14px;
    border-radius:12px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:space-between;

    transition:.25s;
    font-size:15px;
}

.menu-title:hover{
    background:rgba(255,255,255,.10);
    border-color:rgba(140,200,255,.35);
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    width:34px;
    height:34px;

    border-radius:50%;
    border:2px solid #62AEFF;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:16px;
    color:#fff;

    background:rgba(255,255,255,.04);
}

.arrow{
    transition:.25s;
    color:#9CCBFF;
}

.submenu{
    max-height:0;
    overflow:hidden;

    transition:max-height .3s ease;

    margin-left:18px;
}

.menu-item:hover .submenu{
    max-height:220px;
}

.menu-item:hover .arrow{
    transform:rotate(90deg);
}

.submenu a{
    display:block;

    text-decoration:none;
    color:#DCEEFF;

    padding:9px 14px;
    margin-top:6px;

    border-left:2px solid #62AEFF;

    background:rgba(255,255,255,.035);

    border-radius:6px;

    transition:.2s;
    font-size:14px;
}

.submenu a:hover{
    background:rgba(255,255,255,.09);
    color:#fff;
    border-left-color:#A8D5FF;
}

.content{
    flex:1;
    background:#00174F;
    position:relative;
    overflow:hidden;
}

.sidebar::-webkit-scrollbar{
    width:6px;
}

.sidebar::-webkit-scrollbar-track{
    background:#00174F;
}

.sidebar::-webkit-scrollbar-thumb{
    background:#174B91;
    border-radius:10px;
}

.sidebar::-webkit-scrollbar-thumb:hover{
    background:#286BC2;
}

</style>
</head>

<body>

<header>
    <h1>ATOM</h1>
</header>

<div class="container">

    <aside class="sidebar">

        <div class="logo">Navigation</div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">📘</div>
                    Online Kurse
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Webentwicklung</a>
                <a href="#">Python</a>
                <a href="#">JavaScript</a>
                <a href="#">KI & Automatisierung</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">📊</div>
                    Dashboard
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Übersicht</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">💼</div>
                    Projekte
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Meine Projekte</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">📂</div>
                    Ressourcen
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Dateien</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">👥</div>
                    Community
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Forum</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">⬇</div>
                    Downloads
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Material</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">📅</div>
                    Kalender
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Termine</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">🏆</div>
                    Zertifikate
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Meine Zertifikate</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">⚙</div>
                    Einstellungen
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Profil</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-title">
                <div class="left">
                    <div class="icon">❓</div>
                    Hilfe
                </div>
                <span class="arrow">▶</span>
            </button>

            <div class="submenu">
                <a href="#">Support</a>
            </div>
        </div>

    </aside>

    <main class="content">
    </main>

</div>

</body>
</html>
