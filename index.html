<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM</title>

<style>

/* =========================================================
   GRUNDLAGEN
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:
        radial-gradient(circle at 0% 20%, rgba(0,44,255,.35) 0%, transparent 25%),
        radial-gradient(circle at 82% 18%, rgba(0,102,255,.28) 0%, transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(0,55,160,.20) 0%, transparent 35%),
        linear-gradient(
            135deg,
            #01081A 0%,
            #00174F 45%,
            #000E38 100%
        );

    color:white;
    height:100vh;
    overflow:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{
    height:90px;

    background:
        linear-gradient(
            90deg,
            #01081A 0%,
            #00174F 45%,
            #002A7A 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    /* ATOM deutlich weiter nach rechts */
    padding-left:180px;

    border-bottom:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 8px 30px rgba(0,0,0,.45),
        0 0 25px rgba(0,80,255,.10);
}

header h1{
    font-size:48px;
    letter-spacing:16px;
    font-weight:700;

    color:#fff;

    text-shadow:
        0 0 10px rgba(255,255,255,.95),
        0 0 22px rgba(80,150,255,.65),
        0 0 40px rgba(0,90,255,.35);
}


/* =========================================================
   LAYOUT
========================================================= */

.container{
    display:flex;
    height:calc(100vh - 90px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:270px;

    background:
        linear-gradient(
            180deg,
            #01081A 0%,
            #001233 50%,
            #001B4D 100%
        );

    border-right:1px solid rgba(255,255,255,.06);

    padding:18px;

    overflow-y:auto;

    box-shadow:
        8px 0 30px rgba(0,0,0,.25);
}


/* =========================================================
   NAVIGATION
========================================================= */

.logo{
    color:#7FB8FF;

    font-size:13px;

    letter-spacing:3px;

    margin-bottom:18px;

    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(79,161,255,.45);
}


.menu-item{
    margin-bottom:10px;
}


/* =========================================================
   MENÜ BUTTON
========================================================= */

.menu-title{
    width:100%;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.035),
            rgba(0,90,220,.10)
        );

    color:white;

    border:1px solid rgba(255,255,255,.06);

    padding:13px 14px;

    border-radius:12px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:space-between;

    transition:.25s;

    font-size:15px;
}

.menu-title:hover{
    background:
        linear-gradient(
            90deg,
            rgba(0,70,200,.22),
            rgba(0,120,255,.15)
        );

    border-color:rgba(90,160,255,.35);

    box-shadow:
        0 0 18px rgba(0,100,255,.20);
}


/* =========================================================
   LINKER BEREICH
========================================================= */

.left{
    display:flex;

    align-items:center;

    gap:12px;
}


/* =========================================================
   ICONS
========================================================= */

.icon{
    width:34px;
    height:34px;

    border-radius:50%;

    border:2px solid #4EA1FF;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:16px;

    color:#fff;

    background:
        radial-gradient(
            circle,
            rgba(78,161,255,.18),
            rgba(78,161,255,.02)
        );

    box-shadow:
        0 0 10px rgba(78,161,255,.30),
        inset 0 0 8px rgba(78,161,255,.08);
}


/* =========================================================
   PFEIL
========================================================= */

.arrow{
    transition:.25s;

    color:#7FB8FF;

    text-shadow:
        0 0 8px rgba(127,184,255,.55);
}


/* =========================================================
   UNTERMENÜ
========================================================= */

.submenu{
    max-height:0;

    overflow:hidden;

    transition:max-height .3s ease;

    margin-left:18px;
}

.menu-item:hover .submenu{
    max-height:220px;
}

.menu-item:hover .arrow{
    transform:rotate(90deg);
}


/* =========================================================
   UNTERMENÜ LINKS
========================================================= */

.submenu a{
    display:block;

    text-decoration:none;

    color:#D8E9FF;

    padding:9px 14px;

    margin-top:6px;

    border-left:2px solid #4EA1FF;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.025),
            rgba(0,100,255,.08)
        );

    border-radius:6px;

    transition:.2s;

    font-size:14px;
}

.submenu a:hover{
    background:
        linear-gradient(
            90deg,
            rgba(0,90,255,.20),
            rgba(0,140,255,.12)
        );

    color:#fff;

    border-left-color:#79B8FF;

    box-shadow:
        0 0 12px rgba(60,150,255,.15);
}


/* =========================================================
   HAUPTBEREICH
========================================================= */

.content{
    flex:1;

    background:

        radial-gradient(
            circle at 75% 15%,
            rgba(0,90,255,.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 25% 85%,
            rgba(0,50,180,.12),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #020B18 0%,
            #001A42 50%,
            #00102F 100%
        );

    position:relative;

    overflow:hidden;
}


/* =========================================================
   LICHTEFFEKT RECHTS OBEN
========================================================= */

.content:before{
    content:"";

    position:absolute;

    right:-100px;
    top:-40px;

    width:320px;
    height:320px;

    transform:rotate(35deg);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(70,150,255,.08),
            transparent
        );

    filter:blur(2px);
}


/* =========================================================
   LICHTEFFEKT UNTEN
========================================================= */

.content:after{
    content:"";

    position:absolute;

    left:35%;
    bottom:-100px;

    width:300px;
    height:300px;

    transform:rotate(35deg);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(0,100,255,.07),
            transparent
        );

    filter:blur(2px);
}

</style>
</head>
