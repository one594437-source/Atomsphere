
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Atom World - Get in touch with us.">
  <title>ATOM WORLD | Business</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202a3b;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #55d6ff;
    }

    .hero {
      flex: 1;
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at center, #142b49 0%, #080d18 65%);
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 80px);
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #55d6ff;
    }

    .hero p {
      color: #aab8cb;
      font-size: 18px;
      line-height: 1.7;
      max-width: 600px;
      margin-bottom: 35px;
    }

    .contact-button {
      display: inline-block;
      padding: 16px 38px;
      background: #55d6ff;
      color: #080d18;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: 0.3s;
    }

    .contact-button:hover {
      background: white;
      transform: translateY(-3px);
    }

    footer {
      background: #050912;
      padding: 25px 8%;
      text-align: center;
      border-top: 1px solid #202a3b;
      color: #8995a8;
      font-size: 14px;
    }

    footer a {
      color: #55d6ff;
      text-decoration: none;
      margin-left: 15px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Impressum page */

    #impressum {
      display: none;
      flex: 1;
      padding: 100px 20px;
      text-align: center;
    }

    #impressum h1 {
      font-size: 42px;
      color: #55d6ff;
      margin-bottom: 35px;
    }

    #impressum p {
      color: #c0cad8;
      font-size: 18px;
      margin-bottom: 20px;
    }

    #impressum a {
      color: #55d6ff;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #55d6ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ATOM WORLD</div>
  </header>

  <main class="hero" id="home">
    <h1>ATOM <span>WORLD</span></h1>

    <p>
      Welcome to Atom World.<br>
      Interested in working together or have a question?
      Feel free to get in touch.
    </p>

    <a class="contact-button"
       href="mailto:one594437@gmail.com">
       CONTACT ME
    </a>
  </main>

  <section id="impressum">
    <h1>Impressum</h1>

    <p><strong>Contact:</strong></p>

    <p>
      Email:
      <a href="mailto:one594437@gmail.com">
        one594437@gmail.com
      </a>
    </p>

    <a href="#" class="back" onclick="showHome(); return false;">
      ← Back to homepage
    </a>
  </section>

  <footer>
    © 2026 ATOM WORLD. All rights reserved.

    <a href="#impressum" onclick="showImpressum(); return false;">
      Impressum
    </a>
  </footer>

  <script>
    function showImpressum() {
      document.getElementById("home").style.display = "none";
      document.getElementById("impressum").style.display = "block";
      window.location.hash = "impressum";
      window.scrollTo(0, 0);
    }

    function showHome() {
      document.getElementById("impressum").style.display = "none";
      document.getElementById("home").style.display = "flex";
      window.location.hash = "";
      window.scrollTo(0, 0);
    }

    window.addEventListener("load", function() {
      if (window.location.hash === "#impressum") {
        showImpressum();
      }
    });
  </script>

</body>
</html>
