<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================================================
   GESAMTE SEITE
========================================================= */

html,
body{
    width:100%;
    height:100%;
}

body{
    background:
        linear-gradient(
            135deg,
            #01081A 0%,
            #00174F 50%,
            #002A7A 100%
        );

    color:white;
    height:100vh;
    overflow:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{
    height:90px;

    background:
        linear-gradient(
            90deg,
            #01081A 0%,
            #00174F 50%,
            #002A7A 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    /* ATOM weiter nach rechts */
    padding-left:180px;

    border-bottom:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);
}

header h1{
    font-size:48px;

    letter-spacing:16px;

    font-weight:700;

    color:#fff;

    text-shadow:
        0 0 10px rgba(255,255,255,.95),
        0 0 22px rgba(100,170,255,.65),
        0 0 40px rgba(0,90,255,.35);
}


/* =========================================================
   LAYOUT
========================================================= */

.container{
    display:flex;

    height:calc(100vh - 90px);

    background:
        linear-gradient(
            135deg,
            #01081A 0%,
            #00174F 50%,
            #002A7A 100%
        );
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:270px;

    background:
        linear-gradient(
            180deg,
            #01081A 0%,
            #00174F 50%,
            #002A7A 100%
        );

    border-right:1px solid rgba(255,255,255,.08);

    padding:18px;

    overflow-y:auto;

    box-shadow:
        8px 0 30px rgba(0,0,0,.20);
}


/* =========================================================
   NAVIGATION
========================================================= */

.logo{
    color:#9CCBFF;

    font-size:13px;

    letter-spacing:3px;

    margin-bottom:18px;

    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(120,190,255,.40);
}


/* =========================================================
   MENÜ
========================================================= */

.menu-item{
    margin-bottom:10px;
}

.menu-title{
    width:100%;

    background:
        rgba(255,255,255,.045);

    color:white;

    border:1px solid rgba(255,255,255,.08);

    padding:13px 14px;

    border-radius:12px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:space-between;

    transition:.25s;

    font-size:15px;
}

.menu-title:hover{
    background:
        rgba(255,255,255,.10);

    border-color:
        rgba(140,200,255,.35);

    box-shadow:
        0 0 18px rgba(0,100,255,.18);
}


/* =========================================================
   LINKER BEREICH
========================================================= */

.left{
    display:flex;

    align-items:center;

    gap:12px;
}


/* =========================================================
   ICONS
========================================================= */

.icon{
    width:34px;
    height:34px;

    border-radius:50%;

    border:2px solid #62AEFF;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:16px;

    color:#fff;

    background:
        rgba(255,255,255,.04);

    box-shadow:
        0 0 10px rgba(78,161,255,.30);
}


/* =========================================================
   PFEIL
========================================================= */

.arrow{
    transition:.25s;

    color:#9CCBFF;

    text-shadow:
        0 0 8px rgba(140,200,255,.55);
}


/* =========================================================
   UNTERMENÜ
========================================================= */

.submenu{
    max-height:0;

    overflow:hidden;

    transition:max-height .3s ease;

    margin-left:18px;
}

.menu-item:hover .submenu{
    max-height:220px;
}

.menu-item:hover .arrow{
    transform:rotate(90deg);
}


/* =========================================================
   UNTERMENÜ LINKS
========================================================= */

.submenu a{
    display:block;

    text-decoration:none;

    color:#DCEEFF;

    padding:9px 14px;

    margin-top:6px;

    border-left:2px solid #62AEFF;

    background:
        rgba(255,255,255,.035);

    border-radius:6px;

    transition:.2s;

    font-size:14px;
}

.submenu a:hover{
    background:
        rgba(255,255,255,.09);

    color:#fff;

    border-left-color:#A8D5FF;

    box-shadow:
        0 0 12px rgba(80,160,255,.15);
}


/* =========================================================
   CONTENT
   EXAKT DIE GLEICHE BLAUE FARBWELT
========================================================= */

.content{
    flex:1;

    background:
        linear-gradient(
            135deg,
            #01081A 0%,
            #00174F 50%,
            #002A7A 100%
        );

    position:relative;

    overflow:hidden;
}


/* =========================================================
   DEZENTER LICHTEFFEKT
========================================================= */

.content:before{
    content:"";

    position:absolute;

    right:-100px;
    top:-40px;

    width:320px;
    height:320px;

    transform:rotate(35deg);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(120,190,255,.07),
            transparent
        );

    pointer-events:none;
}


/* =========================================================
   DEZENTER LICHTEFFEKT UNTEN
========================================================= */

.content:after{
    content:"";

    position:absolute;

    left:35%;
    bottom:-100px;

    width:300px;
    height:300px;

    transform:rotate(35deg);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(120,190,255,.05),
            transparent
        );

    pointer-events:none;
}


/* =========================================================
   SCROLLBAR
========================================================= */

.sidebar::-webkit-scrollbar{
    width:6px;
}

.sidebar::-webkit-scrollbar-track{
    background:#00174F;
}

.sidebar::-webkit-scrollbar-thumb{
    background:#174B91;
    border-radius:10px;
}

.sidebar::-webkit-scrollbar-thumb:hover{
    background:#286BC2;
}

</style>
</head>
