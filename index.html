
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomsphere Veggies</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffdf7;
  color: #243329;
}
header {
  background: #285b3b;
  color: white;
  text-align: center;
  padding: 35px 15px;
}
header h1 { font-size: 38px; margin: 0; }
main { max-width: 1100px; margin: auto; padding: 20px; }
h2 { color: #285b3b; }
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
  gap: 18px;
}
.product {
  background: white;
  border: 1px solid #dce6d9;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
}
.emoji { font-size: 65px; }
.price { color: #285b3b; font-weight: bold; }
button {
  background: #285b3b;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}
button:hover { background: #39764e; }
.cart, .checkout {
  background: white;
  border: 1px solid #dce6d9;
  border-radius: 15px;
  padding: 20px;
  margin-top: 25px;
}
input, textarea {
  width: 100%;
  padding: 11px;
  margin: 6px 0 14px;
  border: 1px solid #bdcdbb;
  border-radius: 7px;
  box-sizing: border-box;
}
.total { text-align: right; font-weight: bold; font-size: 20px; }
footer { text-align: center; padding: 25px; color: #66756a; }
</style>
</head>
<body>

<header>
<h1>🥕 Atomsphere Veggies</h1>
<p>Frisches Gemüse für deinen Alltag 🌱</p>
</header>

<main>
<h2>Unser Sortiment</h2>
<div class="products" id="products"></div>

<section class="cart">
<h2>🛒 Dein Warenkorb</h2>
<div id="cart-items">Dein Warenkorb ist leer.</div>
<div class="total" id="total">Gesamt: 0,00 €</div>
</section>

<section class="checkout">
<h2>📦 Bestellung abschließen</h2>

<form id="order-form">
<input name="firstName" placeholder="Vorname" required>
<input name="lastName" placeholder="Nachname" required>
<input name="email" type="email" placeholder="E-Mail-Adresse" required>
<input name="phone" placeholder="Telefon (optional)">
<input name="address" placeholder="Straße und Hausnummer" required>
<input name="postalCode" placeholder="Postleitzahl" required>
<input name="city" placeholder="Ort" required>
<textarea name="notes" placeholder="Anmerkungen"></textarea>

<input name="website" style="display:none" tabindex="-1">

<label>
<input type="checkbox" required style="width:auto">
 Ich stimme der Verarbeitung meiner Daten zur Bestellbearbeitung zu.
</label>

<button type="submit" id="submitBtn">
Bestellung senden
</button>
</form>

<p id="status"></p>
</section>
</main>

<footer>
Atomsphere Veggies 🌱
</footer>

<iframe name="order-frame" style="display:none"></iframe>

<script>

// DEINE GOOGLE APPS SCRIPT URL
const ORDER_ENDPOINT =
"https://script.google.com/macros/s/AKfycbzsIBgxhFHTsizMgM7abtCIkeYoUtZ3GWgb7wAK8oEC-A49kefY9vlWNzq8UN-_S4sBvQ/exec";

// PRODUKTE – Beispielpreise
const products = [
{id:1,name:"Karotten",price:2.40,unit:"1 kg",emoji:"🥕"},
{id:2,name:"Tomaten",price:3.90,unit:"1 kg",emoji:"🍅"},
{id:3,name:"Gurken",price:1.60,unit:"Stück",emoji:"🥒"},
{id:4,name:"Paprika",price:2.80,unit:"500 g",emoji:"🫑"},
{id:5,name:"Kartoffeln",price:3.50,unit:"2 kg",emoji:"🥔"},
{id:6,name:"Zwiebeln",price:2.20,unit:"1 kg",emoji:"🧅"},
{id:7,name:"Brokkoli",price:2.30,unit:"Stück",emoji:"🥦"},
{id:8,name:"Salat",price:1.80,unit:"Stück",emoji:"🥬"},
{id:9,name:"Äpfel",price:3.20,unit:"1 kg",emoji:"🍎"},
{id:10,name:"Zucchini",price:2.70,unit:"1 kg",emoji:"🥒"},
{id:11,name:"Knoblauch",price:0.90,unit:"Knolle",emoji:"🧄"}
];

const cart = {};

function euro(n) {
 return n.toFixed(2).replace(".",",") + " €";
}

function renderProducts() {
 document.getElementById("products").innerHTML =
 products.map(p => `
 <div class="product">
 <div class="emoji">${p.emoji}</div>
 <h3>${p.name}</h3>
 <p class="price">${euro(p.price)} / ${p.unit}</p>
 <button type="button" onclick="add(${p.id})">
 In den Warenkorb
 </button>
 </div>
 `).join("");
}

function add(id) {
 cart[id] = (cart[id] || 0) + 1;
 renderCart();
}

function change(id, amount) {
 cart[id] = (cart[id] || 0) + amount;
 if(cart[id] <= 0) delete cart[id];
 renderCart();
}

function renderCart() {
 const items = products.filter(p => cart[p.id]);
 document.getElementById("cart-items").innerHTML =
 items.length ? items.map(p => `
 <p>
 ${p.name} – ${cart[p.id]} × ${euro(p.price)}
 <button type="button" onclick="change(${p.id},-1)">−</button>
 <button type="button" onclick="change(${p.id},1)">+</button>
 </p>
 `).join("") : "Dein Warenkorb ist leer.";

 const total = items.reduce(
 (sum,p) => sum + p.price * cart[p.id], 0
 );

 document.getElementById("total").textContent =
 "Gesamt: " + euro(total);
}

renderProducts();
renderCart();

// BESTELLUNG AN GOOGLE APPS SCRIPT
document.getElementById("order-form")
.addEventListener("submit", function(e) {

 e.preventDefault();

 if(!Object.keys(cart).length) {
   alert("Bitte zuerst Produkte auswählen!");
   return;
 }

 const formData = new FormData(this);

 const items = products
 .filter(p => cart[p.id])
 .map(p => ({
   name:p.name,
   unit:p.unit,
   quantity:cart[p.id],
   unitPrice:p.price,
   lineTotal:p.price * cart[p.id]
 }));

 const total = items.reduce(
   (sum,p) => sum + p.lineTotal, 0
 );

 const payload = {
   firstName:formData.get("firstName"),
   lastName:formData.get("lastName"),
   email:formData.get("email"),
   phone:formData.get("phone"),
   address:formData.get("address"),
   postalCode:formData.get("postalCode"),
   city:formData.get("city"),
   notes:formData.get("notes"),
   website:formData.get("website"),
   items:JSON.stringify(items),
   total:total.toFixed(2)
 };

 const post = document.createElement("form");
 post.method = "POST";
 post.action = ORDER_ENDPOINT;
 post.target = "order-frame";
 post.style.display = "none";

 Object.entries(payload).forEach(([key,value]) => {
   const input = document.createElement("input");
   input.name = key;
   input.value = String(value ?? "");
   post.appendChild(input);
 });

 document.body.appendChild(post);

 const button = document.getElementById("submitBtn");
 const status = document.getElementById("status");

 button.disabled = true;
 status.textContent = "Bestellung wird übermittelt ...";

 post.submit();

 setTimeout(() => {
   status.textContent =
   "Anfrage abgesendet. Bitte prüfe deine E-Mails auf die Bestätigung.";
   button.disabled = false;
   button.textContent = "Erneut senden";
   post.remove();
 },3000);

});

</script>
</body>
</html>
