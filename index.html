<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Design</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #dce5ec;
    font-family: Arial, Helvetica, sans-serif;
}

.cv {
    width: 1050px;
    max-width: 100%;
    margin: auto;
    background: white;
    box-shadow: 0 15px 50px rgba(0,0,0,.2);
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    height: 185px;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(135deg,
        #0b4779 0%,
        #031e3a 55%,
        #06416d 100%);
}

/* Diagonal shapes */

.header::before {
    content: "";
    position: absolute;
    width: 260px;
    height: 300px;
    right: -60px;
    top: -120px;
    transform: skewX(-32deg);
    background: linear-gradient(
        90deg,
        #0b5488,
        #70bdf0
    );
}

.header::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 300px;
    right: 30px;
    top: -120px;
    transform: skewX(-32deg);
    background: rgba(150,210,250,.35);
}

/* Profile image placeholder */

.profile {
    position: absolute;
    z-index: 5;

    left: 55px;
    top: 18px;

    width: 210px;
    height: 210px;

    border-radius: 50%;

    background: white;

    border: 3px solid #4ab9f4;

    overflow: hidden;
}

/* simple placeholder person */

.profile-head {
    position: absolute;

    width: 65px;
    height: 75px;

    left: 72px;
    top: 34px;

    border-radius: 50%;

    background: #c4d0d8;
}

.profile-body {
    position: absolute;

    width: 140px;
    height: 125px;

    left: 35px;
    bottom: -30px;

    border-radius: 60% 60% 0 0;

    background: linear-gradient(
        135deg,
        #173e64,
        #061c34
    );
}

/* Header content */

.header-content {
    position: absolute;

    left: 320px;
    right: 50px;
    top: 55px;

    z-index: 4;
}

.title-line {
    width: 520px;
    max-width: 90%;
    height: 48px;

    border-bottom: 3px solid #4db8ec;

    position: relative;
}

.title-line::before {
    content: "";

    position: absolute;

    left: 0;
    top: 2px;

    width: 70%;
    height: 30px;

    background: white;
    border-radius: 2px;
}

.subtitle {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-top: 12px;
}

.subtitle span {
    height: 9px;

    width: 90px;

    border-radius: 10px;

    background: #e1f1fc;
}

.subtitle span:nth-child(2) {
    width: 120px;
}

.subtitle span:nth-child(3) {
    width: 85px;
}

.subtitle span:nth-child(4) {
    width: 130px;
}

.subtitle i {
    width: 2px;
    height: 15px;

    background: #6abcec;
}


/* =========================
   MAIN LAYOUT
========================= */

.layout {
    display: grid;

    grid-template-columns: 32% 68%;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: relative;

    padding: 48px 30px 70px;

    color: white;

    background:
        linear-gradient(
            155deg,
            #07375e,
            #001b35 80%
        );

    overflow: hidden;
}

.sidebar::after {
    content: "";

    position: absolute;

    width: 450px;
    height: 130px;

    bottom: -30px;
    left: -80px;

    transform: rotate(-48deg);

    background:
        linear-gradient(
            90deg,
            transparent 0 20%,
            #0b4e80 20% 27%,
            #187bbb 27% 31%,
            transparent 31%
        );
}


/* Sidebar sections */

.side-section {
    position: relative;

    z-index: 2;

    margin-bottom: 30px;
}

.side-title {
    display: flex;

    align-items: center;

    gap: 12px;

    padding-bottom: 9px;

    border-bottom: 2px solid #299cdd;
}

.side-icon {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0a3157;

    border: 2px solid #42b4ed;

    font-size: 20px;
}

.side-title-line {
    width: 180px;
    height: 18px;

    border-radius: 5px;

    background:
        linear-gradient(
            90deg,
            white 0 75%,
            transparent 75%
        );
}


/* Lines */

.lines {
    padding: 18px 0 0 60px;

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.lines div {
    height: 10px;

    border-radius: 10px;

    background: #d5e9f6;
}

.lines div:nth-child(2) {
    width: 80%;
}

.lines div:nth-child(3) {
    width: 90%;
}

.lines div:nth-child(4) {
    width: 70%;
}

.lines div:nth-child(5) {
    width: 85%;
}


/* Check lists */

.check-list {
    padding-top: 15px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.check {
    display: flex;

    align-items: center;

    gap: 12px;
}

.check-circle {
    width: 23px;
    height: 23px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #123d62;

    background: white;

    font-weight: bold;

    font-size: 13px;
}

.check-line {
    height: 9px;

    flex: 1;

    border-radius: 10px;

    background: #d8ebf7;
}


/* Languages */

.languages {
    padding-top: 16px;

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.language {
    display: flex;

    align-items: center;
    justify-content: space-between;
}

.language-label {
    width: 75px;
    height: 11px;

    border-radius: 10px;

    background: #d9ebf7;
}

.dots {
    display: flex;

    gap: 7px;
}

.dots span {
    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: white;
}


/* =========================
   CONTENT
========================= */

.content {
    padding: 18px 28px 55px 20px;

    background:
        linear-gradient(
            120deg,
            #ffffff,
            #f8fbfd
        );

    color: #153f68;
}


/* Main heading */

.main-heading {
    display: flex;

    align-items: center;

    gap: 14px;

    padding-bottom: 7px;

    border-bottom: 2px solid #48a9dd;

    margin-bottom: 12px;
}

.main-icon {
    width: 50px;
    height: 50px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background: #173e65;

    font-size: 20px;
}

.heading-line {
    flex: 1;

    height: 19px;

    border-radius: 5px;

    background:
        linear-gradient(
            90deg,
            #173e65 0 45%,
            transparent 45%
        );
}


/* =========================
   TWO COLUMNS
========================= */

.two-columns {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 35px;
}

.main-check {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 10px;
}

.main-check .circle {
    width: 20px;
    height: 20px;

    border-radius: 50%;

    color: white;

    background: #153e66;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 11px;
}

.main-check .line {
    height: 9px;

    flex: 1;

    border-radius: 10px;

    background: #315a80;
}


/* =========================
   ABOUT
========================= */

.about {
    margin-top: 22px;
}

.paragraphs {
    padding: 5px 5px 0;
}

.paragraph {
    height: 11px;

    margin-bottom: 9px;

    border-radius: 10px;

    background: #315f88;
}

.paragraph.short {
    width: 90%;
}

.paragraph.small {
    width: 75%;
}


/* =========================
   TIMELINE
========================= */

.timeline {
    margin-left: 22px;

    padding-left: 27px;

    border-left: 3px solid #173e67;
}

.timeline-item {
    position: relative;

    display: grid;

    grid-template-columns: 120px 1fr;

    gap: 15px;

    padding: 5px 0 25px;

    margin-bottom: 10px;

    border-bottom: 1px dotted #4198c9;
}

.timeline-item:last-child {
    border-bottom: none;
}

.timeline-dot {
    position: absolute;

    left: -39px;
    top: 0;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #153d64;

    border: 3px solid white;
}

.date-lines {
    display: flex;

    flex-direction: column;

    gap: 8px;
}

.date-lines div {
    width: 85px;
    height: 13px;

    border-radius: 10px;

    background: #173f67;
}

.date-lines div:nth-child(2) {
    width: 60px;
}

.role {
    width: 75%;

    height: 15px;

    margin-bottom: 12px;

    border-radius: 10px;

    background: #173f67;
}

.bullets {
    display: flex;

    flex-direction: column;

    gap: 7px;
}

.bullets div {
    width: 95%;

    height: 8px;

    border-radius: 10px;

    background: #4c789d;
}

.bullets div:nth-child(2) {
    width: 85%;
}

.bullets div:nth-child(3) {
    width: 75%;
}


/* =========================
   EDUCATION
========================= */

.education {
    margin-top: 5px;
}

.education-item {
    display: grid;

    grid-template-columns: 30px 1fr 90px;

    gap: 12px;

    padding: 13px 0;
}

.education-dot {
    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #153d64;

    margin-top: 3px;
}

.education-lines {
    display: flex;

    flex-direction: column;

    gap: 8px;
}

.education-lines div {
    height: 10px;

    border-radius: 10px;

    background: #234e77;
}

.education-lines div:nth-child(2) {
    width: 75%;
}

.education-lines div:nth-child(3) {
    width: 85%;
}

.year {
    height: 12px;

    border-radius: 10px;

    background: #234e77;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 760px) {

    body {
        padding: 0;
        background: white;
    }

    .cv {
        width: 100%;
        box-shadow: none;
    }

    .header {
        height: 165px;
    }

    .profile {
        width: 135px;
        height: 135px;

        left: 20px;
        top: 20px;
    }

    .profile-head {
        width: 42px;
        height: 50px;

        left: 46px;
        top: 23px;
    }

    .profile-body {
        width: 90px;
        height: 85px;

        left: 23px;
    }

    .header-content {
        left: 175px;
        top: 50px;
        right: 15px;
    }

    .subtitle {
        display: none;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        padding: 35px 22px;
    }

    .content {
        padding: 25px 18px;
    }

    .two-columns {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .timeline-item {
        grid-template-columns: 80px 1fr;
    }
}

</style>
</head>
