
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATOMSPHERE - Veggies</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #020735;
    color: white;
    font-family: Arial, sans-serif;
}

/* HEADER */

header {
    background: #071044;
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #526aff;
}

header h1 {
    font-size: 30px;
    letter-spacing: 3px;
}

/* BACK BUTTON */

.back {
    display: inline-block;
    margin: 25px;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    background: #152879;
    border: 1px solid #526aff;
    border-radius: 8px;
}

.back:hover {
    background: #263caa;
}

/* TITLE */

.page-title {
    text-align: center;
    margin: 20px 0 35px;
    font-size: 30px;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #526aff;
}

/* IMAGE GRID */

.products {
    max-width: 1250px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
}

/* IMAGE SLOTS */

.product {
    height: 210px;
    background: #071044;
    border: 1px solid #263879;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-5px);
    border-color: #657dff;
    box-shadow: 0 0 18px #263caa;
}

.product img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* RESPONSIVE */

@media(max-width: 900px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 600px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 12px;
    }

    .product {
        height: 160px;
    }
}

</style>
</head>

<body>

<header>
    <h1>ATOMSPHERE</h1>
</header>

<a href="index.html" class="back">← HOME</a>

<h2 class="page-title">VEGETABLES</h2>

<div class="products">

    <div class="product"><img src="images/1.png" alt="Vegetable 1"></div>
    <div class="product"><img src="images/2.png" alt="Vegetable 2"></div>
    <div class="product"><img src="images/3.png" alt="Vegetable 3"></div>
    <div class="product"><img src="images/4.png" alt="Vegetable 4"></div>
    <div class="product"><img src="images/5.png" alt="Vegetable 5"></div>
    <div class="product"><img src="images/6.png" alt="Vegetable 6"></div>
    <div class="product"><img src="images/7.png" alt="Vegetable 7"></div>
    <div class="product"><img src="images/8.png" alt="Vegetable 8"></div>
    <div class="product"><img src="images/9.png" alt="Vegetable 9"></div>
    <div class="product"><img src="images/10.png" alt="Vegetable 10"></div>
    <div class="product"><img src="images/11.png" alt="Vegetable 11"></div>
    <div class="product"><img src="images/12.png" alt="Vegetable 12"></div>
    <div class="product"><img src="images/13.png" alt="Vegetable 13"></div>
    <div class="product"><img src="images/14.png" alt="Vegetable 14"></div>
    <div class="product"><img src="images/15.png" alt="Vegetable 15"></div>
    <div class="product"><img src="images/16.png" alt="Vegetable 16"></div>

</div>

</body>
</html>
